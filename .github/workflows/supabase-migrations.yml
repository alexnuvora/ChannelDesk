name: Supabase Migrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/verify-database.sql'
      - '.github/workflows/supabase-migrations.yml'
permissions:
  contents: read
concurrency:
  group: channeldesk-supabase-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: zmwfyrqbgtvtuajbjnzm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install locked Supabase CLI binary
        run: npm rebuild supabase
      - name: Validate migration locally
        run: npm test
      - name: Link ChannelDesk project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Push migrations
        run: npx supabase db push --yes
      - name: Verify deployed schema and grants
        run: npx supabase db query --linked --file scripts/verify-database.sql
      - name: Run security advisors
        run: npx supabase db advisors --linked --type security --fail-on error
